<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUDAI — Intelligent Process Audit</title>
    <meta name="description" content="Scopri come l'AI può farti risparmiare 20+ ore a settimana. Esegui l'audit e ricevi il tuo piano d'azione.">
    <link rel="icon" href="logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- Spline 3D Viewer -->
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.0.94/build/spline-viewer.js"></script>

    <style>
        /* Landing Page Specific Styles */
        body {
            margin: 0;
            overflow-x: hidden;
            background-color: #050505;
        }

        .spline-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: auto; /* Allow interaction with 3D object */
        }
        
        .spline-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30vh;
            background: linear-gradient(to top, #050505 0%, transparent 100%);
            pointer-events: none;
        }

        .main-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            pointer-events: none; /* Let clicks pass through to Spline where there is no UI */
        }

        .navbar {
            pointer-events: auto;
            background: transparent !important;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 800;
            letter-spacing: 0.1em;
            font-size: 1.4rem;
        }

        .nav-logo img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
        }

        .hero-3d {
            flex: 1;
            display: flex;
            align-items: center;
            padding-top: 15vh;
        }

        .hero-content {
            max-width: 800px;
            pointer-events: auto; /* Re-enable clicks for text and buttons */
        }

        .hero-title {
            font-size: 4.5rem;
            line-height: 1.1;
            margin-bottom: 24px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .hero-desc {
            font-size: 1.3rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 40px;
            text-shadow: 0 5px 20px rgba(0,0,0,0.8);
            max-width: 600px;
        }

        .btn-glow {
            box-shadow: 0 0 30px rgba(124, 92, 252, 0.4);
            transition: all 0.3s ease;
        }

        .btn-glow:hover {
            box-shadow: 0 0 50px rgba(124, 92, 252, 0.6);
            transform: translateY(-2px);
        }

        /* Overlay text indicating interaction */
        .interaction-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.4);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            animation: pulse-opacity 2s infinite;
        }

        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
        
        @media (max-width: 768px) {
            .hero-title { font-size: 3rem; }
            .hero-desc { font-size: 1.1rem; }
            .hero-3d { padding-top: 25vh; }
        }
    </style>
</head>
<body>

    <!-- 3D Background -->
    <div class="spline-container">
        <!-- Using a high-quality abstract dark geometric spline scene -->
        <spline-viewer loading-anim-type="spinner-small-light" url="https://prod.spline.design/6Wq1Q7YGyM-iab9i/scene.splinecode"></spline-viewer>
    </div>

    <!-- UI Overlay -->
    <div class="main-content">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="container nav-container">
                <a href="index.html" class="nav-logo">
                    <img src="logo.png" alt="AUDAI Logo">
                    <span>AUDAI</span>
                </a>
            </div>
        </nav>

        <!-- Hero -->
        <main class="hero hero-3d">
            <div class="container hero-content">
                <div class="hero-micro">INTELLIGENZA ARTIFICIALE PER PMI</div>
                <h1 class="hero-title">
                    Il Futuro della<br>
                    <span class="gradient-text">Tua Azienda.</span>
                </h1>
                <p class="hero-desc">
                    Scopri l'esatto potenziale di automazione dei tuoi processi. Riduci i costi, elimina gli errori e scala senza assumere. 
                </p>
                <div class="hero-ctas">
                    <a href="audit.html" class="btn btn-primary btn-xl btn-glow">
                        <span>Avvia l'Audit Interattivo</span>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                    </a>
                </div>
                <div class="hero-trust" style="margin-top: 24px; color: rgba(255,255,255,0.5);">
                    <div class="avatars" style="display: flex; gap: -10px;">
                        <!-- Simple avatars representation -->
                    </div>
                    <span>Dura meno di 2 minuti. Nessuna registrazione.</span>
                </div>
            </div>
        </main>
        
        <div class="interaction-hint">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            Trascina per esplorare
        </div>
    </div>

    <script>
        // Simple JS for landing page
        document.addEventListener('DOMContentLoaded', () => {
            console.log('AUDAI Landing Page loaded.');
            
            // Remove the spline watermark if possible (hacky, might not work due to shadow DOM)
            setTimeout(() => {
                const viewer = document.querySelector('spline-viewer');
                if(viewer && viewer.shadowRoot) {
                    const logo = viewer.shadowRoot.querySelector('#logo');
                    if(logo) logo.style.display = 'none';
                }
            }, 2000);
        });
    </script>
</body>
</html>
